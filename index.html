<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MOLLY GAME</title>
<script>
(async function(){
  const n = 4;
  let b64 = "";
  for (let i=0;i<n;i++){
    const r = await fetch("./parts/part"+i+".txt");
    if (!r.ok) throw new Error("part "+i+" HTTP "+r.status);
    b64 += await r.text();
  }
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const html = new TextDecoder().decode(bytes);
  document.open(); document.write(html); document.close();
})().catch(e=>{document.body.innerHTML="<pre style='color:#fff;background:#111;padding:20px'>Ошибка загрузки: "+e+"\nОбновите страницу.</pre>";});
</script>
</head><body style="background:#07070b;color:#fff;font-family:sans-serif;padding:24px">Загрузка MOLLY GAME…</body></html>
