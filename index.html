<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOLLY GIFTS</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070709;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(210, 215, 225, 0.22);
      border-radius: 16px;
      padding: 24px;
      background: #0d0d10;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #b8beca;
      border: 1px solid rgba(210, 215, 225, 0.22);
      padding: 4px 8px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #a4aab6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">В разработке</div>
    <h1>MOLLY GIFTS</h1>
    <p>Стартовый экран подключён. Дальше собираем балансы Stars и Gram, режимы и навигацию.</p>
  </div>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
